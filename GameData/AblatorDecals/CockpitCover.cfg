// 1.9.0 (rework): capsules, landers and inline cockpits (Stock, Making History, ReStock, ReStockPlus, Near Future Spacecraft)
// shield only their windward belly / lower reentry body, like the Mk1/Mk2/Mk3 cockpits: windows, hatches and the leeward upper
// hull stay free and white. Built at runtime (no pre-made .bin). 1.10: every capsule is covered on ONE side only, from the
// top rim down to the bottom rim (no ring round the lower skirt): a cut plane through the axis keeps the belly half (mk1-3pod:
// a REGION stepping behind the side windows). 3D tiles there, smooth ceramic where the hull is seen edge-on (ceramicSideDeg).
// Spheres, landers and the cupola: ceramicAll = true, a thin (5 mm) smooth ceramic coat on that half only.
// Windows (WindowKeepOuts.cfg), hatches and (keepRcs) RCS nozzles stay free anyway.

ABLATORDECAL_COVER
{
	part = mk1pod_v2
	ceramicAxis = true
	ceramicSideDeg = 55
	// 1.10: one side only (belly +Z), no ring round the skirt
	PLANE
	{
		normal = 0, 0, -1
		point = 0, 0, 0
		cut = true
	}
	PLANE
	{
		normal = 0, 1, 0
		point = 0, 0.6, 0
		cut = true
	}
	PLANE
	{
		normal = 0, -1, 0
		point = 0, -0.398, 0
		cut = true
	}
}

