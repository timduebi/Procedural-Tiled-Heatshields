        loop = -2 1.77, -1.12 1.77, -0.85 1.83, -0.5 1.86, 0 1.88, 0.5 1.86, 0.85 1.83, 1.12 1.77, 2 1.77, 2 3.4, -2 3.4
        loop = -0.86 1.97, -0.90 2.02, -0.90 2.15, -0.86 2.22, -0.83 2.34, -0.79 2.43, -0.70 2.525, -0.50 2.528, -0.43 2.495, -0.37 2.46, 0.37 2.46, 0.43 2.495, 0.50 2.528, 0.70 2.525, 0.79 2.43, 0.83 2.34, 0.86 2.22, 0.90 2.15, 0.90 2.02, 0.86 1.97
    }
