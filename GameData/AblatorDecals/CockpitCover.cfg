// Cockpit cover for ModuleAblativeDecal (menu "Area" > "Cockpit shape", only shown on the parts listed here).
// With the switch on, a decal on such a cockpit covers only that part (width = height = 2 x the farthest hull point from
// the part origin, max wrap 180) and is cut along the PLANEs and REGIONs. Values are in the cockpit's PART space (partTransform,
// the space of the part's .cfg nodes). A tile is kept where
//   - at least ONE plane without "cut" keeps it (TileSettings.ClipPlanes; kept where dot(normal, p - point) <= 0) or it lies
//     in at least ONE REGION (TileSettings.Regions; the union of both; with neither, everything is kept), and
//   - EVERY plane with "cut = true" keeps it (TileSettings.CutPlanes, intersection; e.g. the stack face at the back).
// REGION (1.5, DESIGN-v11 G2/G3): closed loops drawn on a chart plane and reaching through the part along u x v:
//   origin = x, y, z             chart origin (default 0, 0, 0)
//   u = x, y, z / v = x, y, z    chart axes (unit, orthogonal)
//   loop = u v, u v, ...         one closed loop (metres in the chart), any number of them; inside = inside an odd number
//                                of loops (holes allowed); loops run with the kept area on their left (counter-clockwise)
//   domain = nx, ny, nz, px, py, pz   optional, any number: the region applies only where dot(n, p - point) <= 0
// Tiles are cut straight on the loop edges near them (smooth loops give a smooth border).
// keepRcs = true (1.5): the RCS nozzles of this cockpit stay free (round cut-outs); without it they are tiled over.
//
// part = the name from the part's .cfg; an underscore may be written as in the .cfg (mk2Cockpit_Standard), KSP shows it as
// a dot (mk2Cockpit.Standard). A node without PLANE or REGION does nothing (the switch stays hidden). A later node for the same
// part replaces an earlier one, so another model set can follow as e.g. ABLATORDECAL_COVER:NEEDS[SomeMod] { ... } (with
// ModuleManager). Stock and ReStock use the same Squad models and textures for all three cockpits (ReStock does not replace
// them), so one node each fits both.
// 1.6: all three cockpits use the designs the user chose from preview/v12/cockpit-designs (generated by gen.py there: Mk1 = C
// stepped side line, Mk2 = B Shuttle chin with the line lifted 12 cm, Mk3 = B Shuttle chin; the top always stays free) and are
// pre-made: Covers/<part>_<Hex|Square>.bin, baked from these nodes by tools/Preview --bake-cover (the module loads the file and only
// falls back to the node without it). Rebake after changing a node. tools/Preview --mask traces the dark panels of a texture into REGIONs as a starting point, e.g.:
//   Preview --mask <GameData> mk3Cockpit_Shuttle <dds> <out> "charts=top:0,0,-1:1,0,1,0,0,0/-1,0,1,0,0,0/0,1,0,0,1.9,0;
//     bottom:0,0,1:-1,0,-1,0,0,0/1,0,-1,0,0,0/0,1,0,0,1.9,0;sideP:1,0,0:-1,0,1,0,0,0/-1,0,-1,0,0,0/0,1,0,0,1.9,0;
//     sideN:-1,0,0:1,0,1,0,0,0/1,0,-1,0,0,0/0,1,0,0,1.9,0;front:0,1,0:0,-1,0,0,1.9,0" belly=0,0,1:0.5

// design mk1-C: stepped side line, nose wedge
ABLATORDECAL_COVER
{
	part = Mark1Cockpit
	REGION
	{
		origin = 0, 0, 0
		u = 0, 1, 0
		v = 0, 0, 1
		loop = -0.56 0.3132, -0.26 0.3132, 0.318 0.3305, 0.438 0.1808, 1.022 0.1929, 1.142 0.0733, 2.0575 0.1355, 3.05 -0.145, 3.5 -0.145, 3.5 3, -0.56 3
	}
	// not onto the stack face at the back
	PLANE
	{
		normal = 0, -1, 0
		point = 0, -0.20, 0
		cut = true
	}
}
// design mk2-B: Shuttle chin, angular step
ABLATORDECAL_COVER
{
	part = mk2Cockpit_Standard
	keepRcs = true
	REGION
	{
		origin = 0, 0, 0
		u = 0, 1, 0
		v = 0, 0, 1
		loop = -1.6 -0.274, -1.3 -0.274, 1.4695 -0.0524, 1.6612 -0.2953, 2.428 -0.1573, 3.33 -0.0428, 3.78 -0.0428, 3.78 3, -1.6 3
	}
	// not onto the stack face at the back
	PLANE
	{
		normal = 0, -1, 0
		point = 0, -1.251, 0
		cut = true
	}
}
