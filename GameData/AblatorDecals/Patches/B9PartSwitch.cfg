// Optional: B9PartSwitch switchers with colour swatches for pattern and tile type. Only applied when B9PartSwitch is
// installed (for example through CKAN); without it the decal shows its own choosers.
// ModuleAblativeDecal hides its own Pattern/Tile type choosers as soon as a ModuleB9PartSwitch sits on the part.
//
// Two switchers, two modules: B9PartSwitch does not let two switchers modify the same module, and deselecting a subtype
// reloads the module's original node, which would reset the field the other switcher set. So "pattern" stays in
// ModuleAblativeDecal and the tile type is "finish" in ModuleAblativeDecalFinish. B9 sets them through PartModule.Load;
// both modules react in OnLoad and the decal rebuilds.
@PART[ablativeDecal]:NEEDS[B9PartSwitch]
{
	MODULE
	{
		name = ModuleB9PartSwitch
		moduleID = tilePattern
		switcherDescription = #LOC_AblatorDecals_pattern
		affectDragCubes = false
		affectFARVoxels = false
		uiGroupName = ablatorTiles
		uiGroupDisplayName = #LOC_AblatorDecals_group_tiles

		SUBTYPE
		{
			name = Hex
			title = #LOC_AblatorDecals_pattern_hex
			primaryColor = #262626
			secondaryColor = #505050
			MODULE
			{
				IDENTIFIER
				{
					name = ModuleAblativeDecal
				}
				DATA
				{
					pattern = Hex
				}
			}
		}

		SUBTYPE
		{
			name = Square
			title = #LOC_AblatorDecals_pattern_square
			primaryColor = #141414
			secondaryColor = #3C3C3C
			MODULE
			{
				IDENTIFIER
				{
					name = ModuleAblativeDecal
				}
				DATA
				{
					pattern = Square
				}
			}
		}
	}

	MODULE
	{
		name = ModuleB9PartSwitch
		moduleID = tileFinish
		switcherDescription = #LOC_AblatorDecals_finish
		affectDragCubes = false
		affectFARVoxels = false
		uiGroupName = ablatorTiles
		uiGroupDisplayName = #LOC_AblatorDecals_group_tiles

		SUBTYPE
		{
			name = Black
			title = #LOC_AblatorDecals_finish_black
			primaryColor = #161616
			MODULE
			{
				IDENTIFIER
				{
					name = ModuleAblativeDecalFinish
				}
				DATA
				{
					finish = Black
				}
			}
		}

		SUBTYPE
		{
			name = Ceramic
			title = #LOC_AblatorDecals_finish_ceramic
			primaryColor = #2E2E30
			secondaryColor = #4A4A4C
			MODULE
			{
				IDENTIFIER
				{
					name = ModuleAblativeDecalFinish
				}
				DATA
				{
					finish = Ceramic
				}
			}
		}

		SUBTYPE
		{
			name = White
			title = #LOC_AblatorDecals_finish_white
			primaryColor = #E6E6E2
			MODULE
			{
				IDENTIFIER
				{
					name = ModuleAblativeDecalFinish
				}
				DATA
				{
					finish = White
				}
			}
		}

		SUBTYPE
		{
			name = Steel
			title = #LOC_AblatorDecals_finish_steel
			primaryColor = #9EA4AC
			secondaryColor = #C4CAD2
			MODULE
			{
				IDENTIFIER
				{
					name = ModuleAblativeDecalFinish
				}
				DATA
				{
					finish = Steel
				}
			}
		}
	}
}
