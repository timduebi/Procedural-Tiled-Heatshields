// Deadly Reentry (optional): DRE heats harder and lowers part temperature limits. The tiles are the heat shield, so they get
// heat-shield limits and a little more energy per unit of ablator; set after DRE's own global patches. Only applied with DRE.
// pyrolysisLossFactor / ablationTempThresh are ModuleAblativeDecal fields (defaults 6000 / 500, as the stock heat shields).
@PART[ablativeDecal]:NEEDS[DeadlyReentry]:AFTER[DeadlyReentry]
{
	%maxTemp = 3000
	%skinMaxTemp = 3300
	@MODULE[ModuleAblativeDecal]
	{
		%pyrolysisLossFactor = 8000
		%ablationTempThresh = 600
	}
}
