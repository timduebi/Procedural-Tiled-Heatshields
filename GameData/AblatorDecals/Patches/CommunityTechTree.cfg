// Community Tech Tree (optional): moves the decal next to the other thermal parts. Only applied when CTT is installed;
// the stock tree keeps TechRequired = supersonicFlight (Parts/ablativeDecal.cfg), which CTT also has as a fallback.
@PART[ablativeDecal]:NEEDS[CommunityTechTree]:AFTER[CommunityTechTree]
{
	@TechRequired = heatManagementSystems
}
