// Ferram Aerospace Research (optional): FAR gives every part a GeometryPartModule (:FOR[FerramAerospaceResearch]). The decal's
// own part is a tiny hidden anchor and its tiles sit flush on the hull, so it must not steer the vessel's main axis or add
// voxels of its own; its drag belongs to the covered parts. The B9PartSwitch switchers already set affectFARVoxels = false.
@PART[ablativeDecal]:NEEDS[FerramAerospaceResearch]:AFTER[FerramAerospaceResearch]
{
	@MODULE[GeometryPartModule]
	{
		%ignoreForMainAxis = True
		%ignoreIfNoRenderer = True
	}
}
