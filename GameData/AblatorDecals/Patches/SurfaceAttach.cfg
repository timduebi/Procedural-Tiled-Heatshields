// 1.9: docking ports and heat shields that refuse surface attachment get it, so a heat shield decal can sit on their rims and
// shrouds (Stock, Making History, ReStockPlus, Near Future Spacecraft). Missing parts are skipped by ModuleManager.
// attachRules = stack, srfAttach, allowStack, allowSrfAttach, allowCollision
@PART[HeatShield0|HeatShield1|HeatShield1p5|HeatShield2|HeatShield3|restock-heatshield-1875-1|dockingPortLarge]:FOR[AblatorDecals]
{
	%attachRules = 1,0,1,1,0
}

@PART[InflatableHeatShield]:FOR[AblatorDecals]
{
	%attachRules = 1,0,1,1,1
}

@PART[dockingPort1|InflatableAirlock|restock-airlock-1|docking-nose-0625-1]:FOR[AblatorDecals]
{
	%attachRules = 1,1,0,1,0
}