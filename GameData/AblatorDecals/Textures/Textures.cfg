// The tile texture is picked from (pattern, finish): shape = Hex | Square (also staggered squares) | Any,
// finish = Black | Ceramic (White is gone since 1.4; saved White decals show Black). An exact shape wins over Any.
// emissive = glow texture in the same atlas layout (tools/make-glow-textures.ps1: per tile warm white core -> dark orange rim),
// tinted by glowRamp; without it the glow is flat (glowFlatColor), as on plain textures whose UVs do not follow the tiles.
ABLATORDECAL_TEXTURE
{
	texture = AblatorDecals/Textures/HexBlack
	emissive = AblatorDecals/Textures/HexGlow
	title = #LOC_AblatorDecals_tex_hexblack
	shape = Hex
	finish = Black
	cells = 4, 4
	randomRotation = True
}

ABLATORDECAL_TEXTURE
{
	texture = AblatorDecals/Textures/SquareBlack
	emissive = AblatorDecals/Textures/SquareGlow
	title = #LOC_AblatorDecals_tex_squareblack
	shape = Square
	finish = Black
	cells = 4, 4
	randomRotation = False
}

ABLATORDECAL_TEXTURE
{
	texture = AblatorDecals/Textures/Ceramic
	title = #LOC_AblatorDecals_tex_ceramic
	emissive = AblatorDecals/Textures/HexCeramicGlow
	shape = Hex
	cells = 4, 4
	plainOptions = True
	finish = Ceramic
}

ABLATORDECAL_TEXTURE
{
	texture = AblatorDecals/Textures/Ceramic
	title = #LOC_AblatorDecals_tex_ceramic
	emissive = AblatorDecals/Textures/SquareCeramicGlow
	shape = Square
	cells = 4, 4
	plainOptions = True
	finish = Ceramic
}
