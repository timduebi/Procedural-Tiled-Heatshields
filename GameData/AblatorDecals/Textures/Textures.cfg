// The tile texture is picked from (pattern, finish): shape = Hex | Square (also staggered squares) | Any,
// finish = Black | Ceramic | White | Steel. An exact shape wins over Any.
// metallic = PBR metallic-smoothness atlas (R = Metallic, A = Smoothness; tools/make-pbr-textures.ps1).
// bump = tangent-space normal map (*_NRM.png; KSP auto-converts *_NRM to DXT5nm).
// emissive = glow texture in the same atlas layout (tools/make-glow-textures.ps1: per tile warm white core -> dark orange rim),
// tinted by glowRamp; without it the glow is flat (glowFlatColor), as on plain textures whose UVs do not follow the tiles.
// enabled = False hides a finish from the editor pickers without deleting it (legacy saves still load; set enabled = True
// here and uncomment its SUBTYPE in Patches/B9PartSwitch.cfg to re-enable it).

ABLATORDECAL_TEXTURE
{
	texture = AblatorDecals/Textures/HexBlack
	metallic = AblatorDecals/Textures/HexBlack_MET
	bump = AblatorDecals/Textures/HexBlack_NRM
	emissive = AblatorDecals/Textures/HexGlow
	title = #LOC_AblatorDecals_tex_hexblack
	shape = Hex
	finish = Black
	cells = 4, 4
	randomRotation = True
}

ABLATORDECAL_TEXTURE
{
	texture = AblatorDecals/Textures/SquareBlack
	metallic = AblatorDecals/Textures/SquareBlack_MET
