		#LOC_AblatorDecals_part_title = Ablative Hitzekacheln
		#LOC_AblatorDecals_part_manufacturer = AblatorDecals
		#LOC_AblatorDecals_part_description = Hitzeschild-Kacheln, die wie ein Aufkleber angebracht werden. Ein Decal bedeckt sein Teil mit den angeklebten Steuerflächen, Lufteinlässen und dem eingefahrenen Fahrwerk (oder eine begrenzte Fläche, Breite und Höhe entlang des Rumpfs gemessen); die Kacheln folgen dem Rumpf, bewegen sich mit Steuerflächen, lassen Luken frei (RCS-Düsen nur an Cockpits wie dem Mk2), glühen bei Hitze und schützen nur dort, wo sie im Fahrtwind liegen. Die Dicke bestimmt die Ablator-Menge. Andere Teile, etwa Radial-Decoupler oder Fahrwerke, werden am Rumpf darunter angebracht und sitzen auf den Kacheln; Kacheln kommen nie auf ein anderes Decal.
		#LOC_AblatorDecals_part_tags = ablativ ablator decal hitze schild hitzeschild kachel kacheln hex shuttle starship wiedereintritt
