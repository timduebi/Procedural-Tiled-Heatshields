		#LOC_AblatorDecals_part_title = Ablative Heat Tiles
		#LOC_AblatorDecals_part_manufacturer = AblatorDecals
		#LOC_AblatorDecals_part_description = Heat shield tiles that are applied like a sticker. One decal covers its part with the control surfaces, air intakes and retracted landing gear glued onto it (or a limited area, width and height measured along the hull); the tiles follow the hull, move with control surfaces, leave hatches free (RCS nozzles only on cockpits such as the Mk2), glow when hot and only protect where they face the airflow. Thickness sets the ablator amount. Other parts, such as radial decouplers or landing gear, attach to the hull below and sit on the tiles; tiles never go on top of another decal.
